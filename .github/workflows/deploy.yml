name: Deploy to GitHub Pages

on:
  push:
    branches: "master"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm

      - name: Install dependencies
        run: npm install

      # - name: Copy config
      #   env:
      #     CONFIG_JS: ${{ vars.CONFIG_JS }}
      #   run: echo "$CONFIG_JS" >> config/config.js

      - name: Build client
        run: node build full

      - name: Prepare deployment
        run: ./build-tools/build-pages

      - name: Upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 